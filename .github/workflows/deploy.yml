# Builds the extension and rsyncs dist/ to the DiceVision droplet, which serves
# it at https://rodeo.dirtyowlbear.com (nginx/rodeo.conf in wor101/dice-vision).
# Runs on every push to main; the same thing by hand is `scripts/deploy.sh`.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_TARGET       rsync destination. The deploy key is restricted on the
#                       droplet with `command="rrsync /var/www/rodeo"`, so paths
#                       are relative to the web root: root@rodeo.dirtyowlbear.com:/
#   DEPLOY_SSH_KEY      private key whose public half is in root's authorized_keys
#                       (restricted: command="/usr/bin/rrsync /var/www/rodeo",restrict)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan rodeo.dirtyowlbear.com` (pins the host key)
# Without DEPLOY_TARGET the workflow builds and stops, so a fork or a fresh clone
# of the repo doesn't fail on main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled midway through an rsync.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Install the deploy key
        if: env.DEPLOY_TARGET != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy dist/ to the droplet
        if: env.DEPLOY_TARGET != ''
        env:
          DEPLOY_SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
        run: scripts/deploy.sh --no-build

      - name: No DEPLOY_TARGET secret
        if: env.DEPLOY_TARGET == ''
        run: echo "::notice::DEPLOY_TARGET is not set; built but not deployed."
